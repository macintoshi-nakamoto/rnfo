# RNFO probe registry.
#
# This file is the authority on what a probe id means. The validator rejects
# any measurement row whose probe id is not listed here, so a row can never
# enter the dataset without a documented vantage point behind it.
#
# Fields:
#   id         stable identifier, written into every row; never reused
#   role       probe (measures) | control (measures, outside Russia) |
#              responder (is measured) | collector (stores)
#   status     active | planned | retired
#   net        hosting | eyeball | mobile   -- see docs/METHODOLOGY.md
#   asn        autonomous system as observed, not as advertised by the seller
#   consent    owner  = machine belongs to the project
#              recorded = third party, written consent on file (docs/consent/)
#   dedicated  true only if the machine runs nothing but this project
#   responder_cert_sha256 / responder_ports
#              present on the host that runs the responder; a probe that sees
#              a different certificate is not talking to us
#
# Addresses are deliberately absent. Probe addresses are not part of the
# published dataset (see docs/ETHICS.md); connection details live in .env,
# which is not in git.

schema: v1

probes:
  - id: ru-msk-vps
    role: probe
    status: active
    since: 2026-09-04
    net: hosting
    country: RU
    region: Moscow
    city: Moscow
    asn: AS203273
    asn_name: NetCrafters OU
    operator: NetCrafters OU
    uplink: vps
    consent: owner
    dedicated: true
    clock: chrony
    notes: >
      Dedicated to this project, nothing else installed. A hosting network,
      not an eyeball network: Russian filtering equipment is deployed mainly
      at operators serving subscribers, so this probe is expected to see less
      filtering than a residential line. That difference is a result and must
      not be smoothed over by treating this probe as representative of Russia.

      Transit note, observed 2026-09-05: AS203273 is single-homed through a
      handful of upstreams that include AS216246, and both this host and the
      Frankfurt host de-fra-vps carry hostnames under the same ptr.network
      domain. The RIPE holders differ; the operational provider behind them
      may not. Recorded so that anyone comparing this probe with de-fra-vps
      knows the two ends are less independent than their ASNs suggest. The
      route between them was checked and leaves the operator's network into
      public transit (see de-fra-vps), so the path itself is representative.

  - id: ru-mow-home
    role: probe
    status: active
    since: 2026-09-05
    net: eyeball
    country: RU
    region: Moscow Oblast
    asn: AS8402
    asn_name: PJSC Vimpelcom
    operator: Vimpelcom (Beeline / Corbina), residential broadband
    uplink: broadband
    consent: owner
    dedicated: true
    device: POCO C51 (Xiaomi 2305EPCC4G, Android 13 Go, 32-bit userspace), Termux, agent in -daemon mode
    clock: android-nitz
    notes: >
      The residential vantage point, and the scientifically important one:
      Russian filtering equipment is deployed at operators serving
      subscribers, so this probe sees what the Moscow hosting probe cannot.
      A dedicated handset on the home Wi-Fi, plugged in, nothing else on it.

      Not inside the owner's tunnel - measured, not assumed, on 2026-09-05.
      The handset was made to open a connection to the Moscow probe, whose
      sshd logged the source as a Vimpelcom broadband address, reverse
      DNS under broadband.corbina.ru, AS8402. The owner's workstation
      appears in the same log from an AS200823 node (inside the tunnel),
      which is the contrast that makes the check conclusive. Re-run it with
      `rnfo-probe -whoami` or by the same log trick after any router change.

      Geolocation disagreement, recorded as observed rather than resolved:
      ipinfo places this address in Penza Oblast while the owner is in the
      Moscow region. Russian broadband addresses are pooled across regions and
      city-level geolocation of them is unreliable, so region is written as
      the provider's, and no claim in the dataset may depend on the city.

      The address is dynamic: an ASN change is an event and is logged.

      Android has no /etc/resolv.conf, so a static binary resolves nothing by
      default; the agent is pointed at the home router, which keeps the ISP's
      resolver in the path. The run record carries the resolver used.

      Correction, same day: the first runs carry identity_unknown events and
      asn "unknown", and an earlier draft of this note blamed the operator for
      blocking the geolocation providers. Wrong. The providers answer from
      this network; the agent could not verify their TLS certificates because
      Termux has no /etc/ssl and Go found no root store. Fixed by pointing
      SSL_CERT_FILE at Termux's bundle. Rows from before the fix are valid
      measurements with an unknown ASN; the registry ASN above was confirmed
      independently from the Moscow probe's sshd log.

      Reachable from the collector through a reverse SSH tunnel the phone
      opens to the Moscow probe with a forwarding-only key (loopback port
      2201 there); the collector pulls through it, so the phone still holds
      no credential to the archive.

      Userspace is 32-bit ARM on a 64-bit core, so the binary is GOARCH=arm.
      Clock is Android's network time, good to seconds, not milliseconds.

  - id: ru-mobile
    role: probe
    status: planned
    net: mobile
    country: RU
    asn: unknown
    operator: unknown
    uplink: cellular
    consent: owner
    dedicated: true
    clock: android-nitz
    notes: >
      Not yet assigned a handset: the POCO C51 went to ru-mow-home, which is
      the more valuable role, and the realme Note 60 is the owner's own phone.
      Dedicated handset on a SIM with Wi-Fi switched off, so every row is a
      cellular measurement. Same binary as every other probe, built for
      linux/arm64, scheduled by the agent's own daemon mode because there is
      no systemd. Body cap lowered (max_body in the run record) because the
      link is metered. Carrier NAT reduces the observed TTL by at least one
      hop, which must be calibrated before any TTL analysis in Tier 2. Android
      Go kills background processes aggressively; Termux:Boot, a wake lock and
      battery optimisation disabled for Termux are required, and gaps in the
      run records will show whether that was enough.

  # ---------------------------------------------------------------------
  # Foreign side. Two autonomous systems are now available, which is the
  # minimum for the question "does filtering follow the prefix or the AS".
  # See docs/METHODOLOGY.md, "Vantage point independence".
  # ---------------------------------------------------------------------

  - id: nl-lim-panel
    role: control
    status: active
    since: 2026-09-04
    net: hosting
    country: NL
    region: Limburg
    asn: AS200823
    asn_name: MHost LLC
    operator: MHost LLC
    uplink: vps
    consent: owner
    dedicated: false
    clock: systemd-timesyncd
    notes: >
      The first foreign control for Tier 1, activated 2026-09-04 as a
      documented deviation from the "probes are dedicated machines" rule.
      This machine runs a production web service with real users. The
      deviation is acceptable here and only here: the agent makes outbound
      HTTP requests only, opens no listening port and adds no attack surface.
      It must never host the responder.

      Two caveats for anyone reading the data. Runs from this probe finish in
      minutes while a Russian run takes tens of minutes, because nothing times
      out here; pairing is by run id and slot, and the per-row timestamps give
      the skew. And if this host is ever renumbered, the vantage point changes
      without an asn_changed event, because the new address would be in the
      same AS200823 - so a renumbering must be recorded here by hand.

      Clock is systemd-timesyncd, not chrony: adequate for Tier 1, must be
      changed before any two-sided packet capture.

  - id: de-fra-vps
    role: control
    status: active
    since: 2026-09-04
    net: hosting
    country: DE
    region: Hesse
    city: Frankfurt am Main
    asn: AS210644
    asn_name: AEZA GROUP LLC
    operator: AEZA GROUP LLC
    uplink: vps
    consent: owner
    dedicated: true
    clock: chrony
    responder_cert_sha256: 80309fad7e5ccf3cfcb34febd490671fdbb84d5f54c1424a4b667f9aac670821
    responder_ports: "443,8443,2053,9443 tls; 8080 raw"
    notes: >
      The dedicated foreign host: second foreign control and the only machine
      permitted to run the responder. Bought 2026-09-04 specifically to be in
      an autonomous system other than AS200823, and placed in Frankfurt on
      purpose - the project's AS200823 node is in the same city, so a
      comparison between the two holds geography roughly constant and varies
      only the destination network.

      Route from ru-msk-vps, measured 2026-09-05: 11 hops here against 7 hops
      to the AS200823 Frankfurt node, diverging at the fourth hop, both
      through public transit. The asymmetry is a confound to keep in mind - a
      difference in filtering between the two destinations may be an effect
      of path length rather than of the autonomous system - and it is what the
      TTL analysis in Tier 2 is for.

      Shares an upstream (AS216246) and a hostname domain with ru-msk-vps; see
      that entry. Domestic Russian controls are not expected to answer from
      here: gosuslugi.ru timed out on first contact on 2026-09-04. Health is
      therefore judged on the international controls alone (agent 0.2.0+).

      The responder listens on the ports above and returns the certificate
      with the fingerprint above for any server name it is asked for. Its
      address is dialled directly by every probe as the "own" target set.
