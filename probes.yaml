# RNFO probe registry.
#
# This file is the authority on what a probe id means. The validator rejects
# any measurement row whose probe id is not listed here, so a row can never
# enter the dataset without a documented vantage point behind it.
#
# Fields:
#   id         stable identifier, written into every row; never reused
#   role       probe (measures) | control (measures, outside Russia) |
#              responder (is measured) | collector (stores)
#   status     active | planned | retired
#   net        hosting | eyeball | mobile   -- see docs/METHODOLOGY.md
#   asn        autonomous system as observed, not as advertised by the seller
#   consent    owner  = machine belongs to the project
#              recorded = third party, written consent on file (docs/consent/)
#   dedicated  true only if the machine runs nothing but this project
#
# Addresses are deliberately absent. Probe addresses are not part of the
# published dataset (see docs/ETHICS.md); connection details live in .env,
# which is not in git.

schema: v1

probes:
  - id: ru-msk-vps
    role: probe
    status: active
    since: 2026-09-04
    net: hosting
    country: RU
    region: Moscow
    city: Moscow
    asn: AS203273
    asn_name: NetCrafters OU
    operator: NetCrafters OU
    uplink: vps
    consent: owner
    dedicated: true
    clock: chrony
    notes: >
      Dedicated to this project, nothing else installed. A hosting network,
      not an eyeball network: Russian filtering equipment is deployed mainly
      at operators serving subscribers, so this probe is expected to see less
      filtering than a residential line. That difference is a result and must
      not be smoothed over by treating this probe as representative of Russia.

  - id: ru-mow-home
    role: probe
    status: planned
    net: eyeball
    country: RU
    region: Moscow Oblast
    asn: unknown
    operator: unknown
    uplink: broadband
    consent: owner
    dedicated: false
    notes: >
      The residential vantage point, and the scientifically important one.
      Blocked on two conditions before it may be activated: the measuring host
      must not send its traffic through the operator's own AmneziaWG tunnel
      (the vantage point rule (docs/METHODOLOGY.md §5), otherwise we measure our own VPN), and the
      address is dynamic, so an ASN change is an event and must be logged.

  - id: ru-mobile
    role: probe
    status: planned
    net: mobile
    country: RU
    asn: unknown
    operator: unknown
    uplink: cellular
    consent: owner
    dedicated: true
    notes: >
      Old Android with Termux, not yet acquired. Same agent binary, built for
      linux/arm64. Carrier NAT reduces the observed TTL by at least one hop,
      which must be calibrated before any TTL analysis in Tier 2.

  # ---------------------------------------------------------------------
  # Foreign side. Nothing here is active yet, and the reason is a problem
  # with the inventory rather than with the code. See docs/METHODOLOGY.md,
  # "Vantage point independence".
  # ---------------------------------------------------------------------

  - id: nl-lim-panel
    role: control
    status: active
    since: 2026-09-04
    net: hosting
    country: NL
    region: Limburg
    asn: AS200823
    asn_name: MHost LLC
    operator: MHost LLC
    uplink: vps
    consent: owner
    dedicated: false
    clock: systemd-timesyncd
    notes: >
      The foreign control for Tier 1, activated 2026-09-04 as a documented
      deviation from the "probes are dedicated machines" rule. This machine
      runs a production web service with real users. The deviation is
      acceptable here and only here: the agent makes outbound HTTP requests
      only, opens no listening port and adds no attack surface. It is NOT
      acceptable for the Tier 3 responder, which must be a clean address in a
      different autonomous system.

      Two caveats for anyone reading the data. Runs from this probe finish in
      minutes while a Russian run takes tens of minutes, because nothing times
      out here; pairing is by run id and slot, and the per-row timestamps give
      the skew. And if this host is ever renumbered, the vantage point changes
      without an asn_changed event, because the new address would be in the
      same AS200823 - so a renumbering must be recorded here by hand.

      Clock is systemd-timesyncd, not chrony: adequate for Tier 1, must be
      changed before any two-sided packet capture.

  - id: de-fra-clean
    role: responder
    status: planned
    net: hosting
    country: DE
    asn: unknown
    operator: to be chosen outside AS200823
    uplink: vps
    consent: owner
    dedicated: true
    notes: >
      Not yet bought. This is the missing piece of the design. It must be in a
      different autonomous system from every other host we own, because the
      question "does filtering follow the destination prefix or the
      destination AS" cannot be answered with four hosts inside one AS.
